# The project is built with Rust nightly: rustup installs the newest nightly, with the browser (wasm32) target, on the
# first `cargo` command in this directory. The code stays within stable Rust (`rust-version` in Cargo.toml is the
# oldest release that builds it), so a stable compiler works as well.
[toolchain]
channel = "nightly"
targets = ["wasm32-unknown-unknown"]
components = ["clippy", "rustfmt"]
profile = "minimal"
