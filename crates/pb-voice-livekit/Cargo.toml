[package]
name = "pb-voice-livekit"
description = "Voice transport on the official LiveKit Rust SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
# Without the SDK's own network transport (its TLS is `ring`): src/net.rs registers ours.
livekit = { version = "0.9.3", default-features = false }
livekit-net = { version = "0.1.3", default-features = false }
livekit-protocol = "0.8.0"
pb-domain.workspace = true
pb-fluxer-api.workspace = true
pb-tls.workspace = true
pb-voice-api.workspace = true
reqwest.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[dev-dependencies]
pb-testkit = { workspace = true, features = ["livekit"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
