[package]
name = "pb-tts-piper"
description = "Piper text-to-speech on rten with espeak-ng phonemes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pb-espeak.workspace = true
pb-models-api.workspace = true
rten = { version = "0.27.0", default-features = false, features = ["onnx_format", "random"] }
rten-tensor = "0.27.0"
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1.25"

[dev-dependencies]
pb-testkit.workspace = true
# Only for the report that tracks the pure-Rust espeak-ng port against the C library (docs/proposals/0003).
espeak-ng = { version = "0.2.0", default-features = false, features = ["bundled-data"] }
pb-models-api = { workspace = true, features = ["contract-tests"] }
safetensors.workspace = true

[lints]
workspace = true
