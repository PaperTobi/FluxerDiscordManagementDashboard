[package]
name = "pb-testkit"
description = "Test helpers: local LiveKit server, tokens, participants, an in-process voice transport, golden data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
pb-audio.workspace = true
livekit = { version = "0.9.3", default-features = false, optional = true }
pb-voice-livekit = { workspace = true, optional = true }
rubato.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"], optional = true }
futures = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
pb-domain = { workspace = true, optional = true }
pb-fluxer-api = { workspace = true, optional = true }
pb-voice-api = { workspace = true, optional = true }

[features]
# The local LiveKit server, tokens and scripted participants (pulls in the LiveKit SDK).
livekit = ["dep:livekit", "dep:pb-voice-livekit", "dep:tokio", "dep:futures", "dep:hmac", "dep:sha2", "dep:base64"]
# An in-process voice transport (sample-exact audio, no server).
memvoice = ["dep:tokio", "dep:async-trait", "dep:pb-domain", "dep:pb-fluxer-api", "dep:pb-voice-api"]

[lints]
workspace = true
