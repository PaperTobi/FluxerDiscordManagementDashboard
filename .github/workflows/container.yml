# Builds the container image on every push and publishes it to the GitHub Container Registry (ghcr.io).
#
#   main            -> ghcr.io/<owner>/<repo>:latest, :main and :sha-<commit>
#   other branches  -> :<branch> and :sha-<commit>
#   tags v1.2.3     -> :1.2.3, :1.2 and :sha-<commit>
#
# Pull it with:  podman pull ghcr.io/<owner>/<repo>:latest   (the image name is lower case)
name: container

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# a newer push to the same branch replaces a build that is still running
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # the build (Rust, LLVM, 1.7 GB of weights) needs far more than the free space of a fresh runner
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
